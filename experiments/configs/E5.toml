# E5: partitions (docs/RESEARCH.md §6, H2b; details in amendment A5). Paper-like network,
# 150-300 ms timeouts, 4 clients. Simulator: P1-P5 at the sizes of §6, 1000 seeds.
# Real cluster: P1 and P3 with 5 servers, 100 seeds.

id = "E5"
description = "Unavailability and unnecessary leader changes under partitions"

