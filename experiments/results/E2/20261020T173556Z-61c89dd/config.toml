# E2: reproduction of the Raft paper's Figure 16 (docs/RESEARCH.md §6).
# Five servers on the paper-like network; the heartbeat interval is half the minimum
# election timeout. 150-300 ms belongs to both of the paper's graphs.

id = "E2"
description = "Time to replace a crashed leader across election timeout ranges"

[[run]]
scenario = "figure16"
label = "150-150"
algorithm = "raft"
servers = 5
network = "paper"
seeds = [1, 1000]
election_timeout_ms = [150, 150]

