# Exploratory, not part of the pre-registered protocol: E2 repeated on the LAN-like
# network, where Raft's timing requirement (broadcast time much shorter than the election
# timeout) holds even for 12-24 ms. Added after E2's R2 criterion failed on the paper-like
# network, to check whether the simulator reproduces the paper's pattern when the
# requirement holds (docs/RESEARCH.md amendment A2).

id = "E2-lan"
description = "Exploratory: E2 on the LAN-like network"

[[run]]
scenario = "figure16"
label = "150-150"
algorithm = "raft"
servers = 5
network = "lan"
seeds = [1, 1000]
election_timeout_ms = [150, 150]

