[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/siddak1234/raft-vector-store"
publish = false

# Every dependency version is declared once here. Crates refer to an entry with
# `name.workspace = true`. Add a dependency in the commit that first uses it.
[workspace.dependencies]
# Workspace crates. `bench` and `xtask` are not listed because no crate may depend on them.
client = { path = "crates/client" }
consensus = { path = "crates/consensus" }
controlplane = { path = "crates/controlplane" }
datanode = { path = "crates/datanode" }
modelcheck = { path = "crates/modelcheck" }
paxos = { path = "crates/paxos" }
raft = { path = "crates/raft" }
rpc = { path = "crates/rpc" }
sim = { path = "crates/sim" }

# External crates
hdf5-reader = "0.9.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
prost = "0.14.4"
protox = "0.10.0"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stateright = "0.31.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
