name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so check-repo can compare experiment results with earlier commits.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Repository rules
        run: cargo xtask check-repo
        env:
          # On a push, check results against the commit before the push; on a pull
          # request, against main.
          CHECK_REPO_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}

  analysis:
    name: analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags, not a floating major tag.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check the lockfile
        working-directory: analysis
        run: uv lock --check
